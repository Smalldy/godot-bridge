<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>godot-bridge · DSH preview</title>
<style>
:root{
  --bg:#151517;--sidebar:#1b1b1c;--layer1:#232324;--layer2:#2c2c2e;--layer3:#353536;
  --text:#f9fafb;--secondary:#cfd3d6;--tertiary:#adb2b8;--caption:#81858c;
  --border:rgba(255,255,255,.12);--border-soft:rgba(255,255,255,.06);
  --blue:#7aaaff;--green:#22c55e;--amber:#f59e0b;--red:#f25a5a;--purple:#b7a6ff;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-panel:18px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{display:flex;height:100vh;min-height:0;overflow:hidden}
/* DSH sidebar — geometry and tokens follow ui-sidebar/SidebarRoot.module.css */
.sidebar{width:264px;flex:none;display:flex;flex-direction:column;padding:6px 12px;background:var(--sidebar);border-right:1px solid var(--border-soft);font-size:14px;overflow:hidden}
.logoRow{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 0 8px 4px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;line-height:24px;letter-spacing:.04em;color:var(--text)}
.whale{width:24px;height:24px;flex:none;color:var(--text)}
.newSession{height:38px;flex:none;display:flex;align-items:center;justify-content:center;gap:6px;margin:0 2px 12px;border:0.5px solid var(--border);border-radius:var(--radius-md);background:#43454a;color:var(--text);font-size:14px;font-weight:500}
.newSession:hover{background:#4b4d52}
.panelList{flex:none;display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.panelRow{height:36px;display:flex;align-items:center;gap:8px;margin:0 2px;padding:7px 8px;border-radius:var(--radius-md);color:var(--text);font-size:14px;line-height:22px;text-align:left}
.panelRow:hover{background:rgba(255,255,255,.06)}
.panelRow.active{background:rgba(255,255,255,.08)}
.panelRow .ico{width:16px;height:16px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--secondary)}
.panelRow.active .ico{color:var(--text)}
.region{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;margin:0 -12px 0 -4px;padding-left:4px}
.sectionHead{height:36px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px;margin:2px 0 4px;color:var(--tertiary);font-size:12px;line-height:20px}
.sectionHead .grow{flex:1}
.sectionHead .hico{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--tertiary)}
.sectionHead .hico:hover{background:rgba(255,255,255,.06);color:var(--text)}
.rows{overflow:auto;min-height:0;padding-right:12px}
.projectRow{height:34px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:var(--radius-md);color:var(--text);font-size:14px}
.projectRow:hover{background:rgba(255,255,255,.06)}
.projectRow.active{background:rgba(255,255,255,.06)}
.projectRow.active .folderIcon{color:var(--blue)}
.folderIcon{width:16px;height:16px;color:var(--tertiary);flex:none}
.statusDot{width:10px;height:10px;border-radius:50%;border:1.4px solid #6f7277;display:inline-block;flex:none;margin:0 3px}
.statusDot.running{border-color:var(--blue);box-shadow:0 0 0 2px rgba(122,170,255,.12)}
.projectRow .folder{width:16px;height:16px;color:var(--tertiary);flex:none}
.projectRow .count{margin-left:auto;color:var(--caption);font-size:11px;white-space:nowrap;flex:none}
.sessionRow{height:32px;display:flex;align-items:center;gap:4px;padding:0 8px;border-radius:var(--radius-md);color:var(--text);font-size:14px}
.sessionRow:hover{background:rgba(255,255,255,.06)}
.sessionRow.selected{background:rgba(255,255,255,.08)}
.sessionRow .dot{width:16px;height:20px;display:grid;place-items:center;color:var(--tertiary);flex:none}
.sessionRow .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sideFoot{flex:none;margin-top:auto;border-top:1px solid var(--border-soft);padding:10px 4px 4px;display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:#3b3d42;display:grid;place-items:center;font-size:11px;color:#e8eaed;flex:none}
.sideFoot b{display:block;font-size:13px;font-weight:500;color:var(--text)}
.sideFoot span{display:block;font-size:11px;color:var(--caption)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.plugin{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ptop{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border-soft);background:var(--bg)}
.pmark{width:30px;height:30px;border-radius:9px;background:#f9fafb;color:#151517;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.ptitle{min-width:0;flex:1}
.ptitle h1{font-size:15px;font-weight:600;margin:0;line-height:22px}
.psub{display:flex;align-items:center;gap:7px;margin-top:2px;color:var(--caption);font-size:11px;font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;border:1px solid var(--border);color:var(--tertiary);font-size:11px;white-space:nowrap}
.badge.ok{color:#8ce0aa;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)}
.pactions{display:flex;gap:6px;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 10px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--secondary);font-size:12px}
.btn.primary{background:#f9fafb;border-color:#f9fafb;color:#151517;font-weight:600}
.ptabs{height:42px;flex:none;display:flex;align-items:center;gap:2px;padding:0 18px;border-bottom:1px solid var(--border-soft);background:var(--bg)}
.ptab{height:42px;padding:0 11px;color:var(--tertiary);font-size:13px;border-bottom:2px solid transparent}
.ptab.active{color:var(--text);border-bottom-color:#f9fafb}
.pcounts{margin-left:auto;display:flex;gap:6px}
.count{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--layer1);color:var(--tertiary);font-size:11px}
.count b{color:var(--text);font-weight:600}
/* board */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:12px;overflow:auto;background:var(--bg)}
.col{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--sidebar);border:1px solid var(--border-soft);border-radius:10px}
.colHead{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 9px;border-bottom:1px solid var(--border-soft);color:var(--tertiary);font-size:11px}
.colHead b{margin-left:auto;color:var(--secondary);font-weight:500;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.cards{display:flex;flex-direction:column;gap:7px;padding:7px;overflow:auto;min-height:0}
.card{background:var(--layer1);border:1px solid var(--border-soft);border-radius:9px;padding:9px}
.card:hover{border-color:var(--border);background:#26262a}
.cardTop{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.cid{font-family:var(--mono);font-size:10px;color:var(--tertiary)}
.cpri{margin-left:auto;font-size:9px;color:var(--amber)}
.ckind{font-size:9px;color:var(--purple);border:1px solid rgba(183,166,255,.3);border-radius:4px;padding:0 4px}
.card h3{font-size:12px;line-height:1.4;font-weight:500;margin:0 0 6px;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;height:17px;padding:0 5px;border-radius:4px;background:var(--layer2);border:1px solid var(--border-soft);color:var(--tertiary);font-size:9px;white-space:nowrap}
.chip.green{color:#8ce0aa;background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.22)}
.chip.amber{color:#f3c675;background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.22)}
.chip.red{color:#ff9d9d;background:rgba(242,90,90,.08);border-color:rgba(242,90,90,.22)}
.chip.purple{color:#d0bdff;background:rgba(183,166,255,.08);border-color:rgba(183,166,255,.22)}
.cardMeta{display:flex;align-items:center;gap:5px;margin-top:7px;color:var(--caption);font-size:9.5px}
.cardMeta .avatar{width:15px;height:15px;font-size:7px;background:#3b3d42}
.cardMeta .right{margin-left:auto;font-family:var(--mono)}
/* detail */
.overlay{position:absolute;inset:0;z-index:5;display:flex;justify-content:center;align-items:flex-start;padding:22px;background:rgba(0,0,0,.55);overflow:auto}
.detail{width:1120px;max-width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden}
.dHead{display:flex;align-items:flex-start;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border-soft);background:var(--layer1)}
.dHead h2{font-size:16px;font-weight:600;margin:0;line-height:1.35}
.dSub{display:flex;align-items:center;gap:7px;margin-top:4px;color:var(--tertiary);font-size:11px}
.dClose{margin-left:auto;color:var(--tertiary);font-size:14px}
.spine{display:flex;padding:12px 18px;border-bottom:1px solid var(--border-soft);background:var(--bg)}
.step{flex:1;font-size:10px;color:var(--caption);padding-right:8px}
.step:before{content:"";display:block;height:2px;background:var(--layer2);border-radius:2px;margin-bottom:6px}
.step.done:before{background:var(--green)}.step.active:before{background:var(--blue)}.step.active{color:var(--text)}
.step b{display:block;font-size:10.5px;font-weight:500;color:inherit}.step span{font-size:9px;color:var(--caption)}
.dBody{display:grid;grid-template-columns:minmax(0,1fr) 300px;max-height:620px;overflow:auto}
.dMain{padding:15px 18px;border-right:1px solid var(--border-soft)}
.dAside{padding:15px;background:var(--sidebar)}
.sect{margin-bottom:15px}.sect h4{margin:0 0 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tertiary);font-weight:500}
.sect p{margin:0;color:var(--secondary);font-size:12px;line-height:1.65}
.box{background:var(--layer1);border:1px solid var(--border-soft);border-radius:8px;padding:9px;color:var(--secondary);font-size:11.5px;line-height:1.6;white-space:pre-wrap}
.evidence{background:var(--sidebar);border:1px solid var(--border-soft);border-radius:8px;padding:9px;color:var(--tertiary);font-family:var(--mono);font-size:10px;line-height:1.55;white-space:pre-wrap}
.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1;height:32px}
.field{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border-soft);font-size:10.5px;color:var(--tertiary)}
.field b{color:var(--secondary);font-weight:500;text-align:right}
/* report */
.casebook{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--bg);overflow:hidden}
.caseIndex{padding:13px;background:var(--sidebar);border-right:1px solid var(--border-soft);overflow:auto}
.caseIndex h3{margin:0 0 9px;color:var(--tertiary);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.idx{display:block;padding:6px 8px;margin-bottom:2px;border-radius:6px;color:var(--tertiary);font-size:11px;border-left:2px solid transparent}
.idx.active{background:var(--layer1);color:var(--text);border-left-color:var(--purple)}
.caseMeta{margin-top:14px;color:var(--caption);font-size:10px;line-height:1.8}.caseMeta b{color:var(--purple);font-weight:500}
.paper{margin:14px 20px;padding:22px 26px;background:var(--layer1);border:1px solid var(--border-soft);border-radius:12px;overflow:auto;height:calc(100% - 28px)}
.kicker{color:var(--purple);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.paper h2{font-size:20px;font-weight:600;margin:7px 0 5px;line-height:1.3}
.paper .meta{color:var(--caption);font-family:var(--mono);font-size:10px;margin-bottom:15px}
.paper h3{font-size:12px;font-weight:600;margin:16px 0 6px;color:var(--text);border-bottom:1px solid var(--border-soft);padding-bottom:5px}
.paper p{color:var(--secondary);font-size:12px;line-height:1.7;margin:0 0 8px}
.paper ul{margin:0 0 9px;padding-left:17px;color:var(--secondary);font-size:12px;line-height:1.7}
.paper code{font-family:var(--mono);font-size:10px;background:var(--sidebar);border:1px solid var(--border-soft);border-radius:4px;padding:1px 4px;color:#9fe4e8}
.paper pre{background:var(--sidebar);border:1px solid var(--border-soft);border-radius:8px;padding:9px 11px;color:var(--secondary);font-family:var(--mono);font-size:10px;line-height:1.6;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:10px;margin:6px 0 12px}
th,td{border:1px solid var(--border-soft);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--sidebar);color:var(--tertiary);font-weight:500}td{color:var(--secondary)}
.artifacts{display:flex;flex-wrap:wrap;gap:5px}.artifact{font-family:var(--mono);font-size:9px;color:var(--tertiary);background:var(--sidebar);border:1px solid var(--border-soft);border-radius:4px;padding:2px 6px}
/* roles */
.roles{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr);overflow:hidden;background:var(--bg)}
.roleList{padding:12px;background:var(--sidebar);border-right:1px solid var(--border-soft);overflow:auto}
.roleList h3{margin:0 0 9px;color:var(--tertiary);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.roleRow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;color:var(--tertiary);font-size:12px;margin-bottom:2px}
.roleRow.active{background:var(--layer1);color:var(--text)}
.roleRow .rkind{margin-left:auto;font-size:9px;color:var(--caption)}
.roleEdit{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.roleHead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-soft);background:var(--layer1)}
.roleHead h2{margin:0;font-size:15px;font-weight:600}.roleHead .sub{margin-top:2px;color:var(--tertiary);font-size:11px}
.roleBody{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 18px;overflow:auto;min-height:0}
.rcol{display:flex;flex-direction:column;gap:8px;min-width:0}.rcol h3{margin:0;color:var(--tertiary);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.fieldrow{display:flex;flex-wrap:wrap;gap:6px}.pill{display:inline-flex;height:22px;align-items:center;padding:0 8px;border:1px solid var(--border);border-radius:999px;color:var(--tertiary);font-size:10px}
.pill.blue{color:#a9c8ff;border-color:rgba(122,170,255,.3);background:rgba(122,170,255,.08)}
.prompt{background:var(--sidebar);border:1px solid var(--border-soft);border-radius:8px;padding:10px;color:var(--secondary);font-family:var(--mono);font-size:10.5px;line-height:1.65;white-space:pre-wrap;min-height:250px}
.preview{background:var(--layer1);border:1px solid var(--border);border-radius:8px;padding:11px;color:var(--secondary);font-size:11px;line-height:1.65;min-height:250px}
.preview h5{margin:0 0 6px;color:var(--text);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.injected{border-left:2px solid var(--purple);padding-left:9px;margin:8px 0;color:#d3c4f5}
/* status */
.status{flex:1;min-height:0;overflow:auto;padding:14px 18px;background:var(--bg)}
.summary{display:flex;align-items:center;gap:12px;background:var(--layer1);border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:11px;color:var(--secondary)}
.summary b{color:var(--text);font-weight:600}.summary .grow{flex:1}.mono{font-family:var(--mono);font-size:10px;color:var(--tertiary)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.scard{background:var(--layer1);border:1px solid var(--border-soft);border-radius:10px;padding:11px 12px;min-height:150px}
.scard h3{margin:0 0 8px;color:var(--tertiary);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;display:flex;align-items:center;gap:6px}
.big{font-size:18px;font-weight:600;color:var(--text);margin:2px 0 7px}.big span{font-size:10px;font-weight:400;color:var(--tertiary);margin-left:5px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--border-soft);font-size:10.5px;color:var(--tertiary)}.kv b{color:var(--secondary);font-weight:500}
.activity{background:var(--layer1);border:1px solid var(--border-soft);border-radius:10px;padding:11px 12px}
.activity h3{margin:0 0 5px;color:var(--tertiary);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.arow{display:grid;grid-template-columns:64px 82px minmax(0,1fr) 80px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:10.5px;color:var(--secondary)}
.arow .time{font-family:var(--mono);color:var(--caption);font-size:9.5px}.arow .who{color:var(--text)}.arow .tag{justify-self:end;color:var(--tertiary);border:1px solid var(--border-soft);border-radius:4px;padding:0 5px;font-size:9px}
/* workers/queue */
.tablewrap{flex:1;min-height:0;overflow:auto;padding:14px 18px;background:var(--bg)}
.wtable{width:100%;border-collapse:separate;border-spacing:0 4px}
.wtable th{text-align:left;padding:4px 8px;color:var(--tertiary);font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.wtable td{padding:8px;background:var(--layer1);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);color:var(--secondary);font-size:11px}
.wtable tr td:first-child{border-left:1px solid var(--border-soft);border-radius:7px 0 0 7px}.wtable tr td:last-child{border-right:1px solid var(--border-soft);border-radius:0 7px 7px 0}
.wtable .mono{color:var(--tertiary);font-size:10px}
.pillstatus{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:999px;border:1px solid var(--border-soft);color:var(--tertiary);font-size:9px}
.pillstatus.running{color:#9fe4e8;border-color:rgba(57,197,207,.3);background:rgba(57,197,207,.08)}
.pillstatus.done{color:#8ce0aa;border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.08)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--layer1);border:1px solid var(--border-soft);border-radius:9px}
.qrow .order{width:20px;color:var(--caption);font-family:var(--mono);font-size:10px}.qrow .qid{width:52px;color:var(--tertiary);font-family:var(--mono);font-size:10px}
.qrow .qtitle{flex:1;color:var(--text);font-size:11.5px}.qrow .qmeta{display:flex;gap:5px}
/* done drawer */
.drawer{position:absolute;inset:0;z-index:6;display:flex;justify-content:flex-end;background:rgba(0,0,0,.5)}
.donebox{width:500px;height:100%;background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column}
.doneHead{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border-soft)}.doneHead h2{margin:0;font-size:14px;font-weight:600}
.doneSearch{display:flex;gap:8px;padding:12px 16px}.doneSearch input{flex:1;height:30px;padding:0 9px;background:var(--layer1);border:1px solid var(--border-soft);border-radius:7px;color:var(--text);font:inherit;font-size:11px;outline:none}
.doneBody{overflow:auto;padding:0 16px 16px}.day{margin:11px 0 5px;color:var(--caption);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.drow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border-soft)}.drow .did{width:42px;color:var(--tertiary);font-family:var(--mono);font-size:9px}.drow .dtitle{flex:1;color:var(--secondary);font-size:11px}
/* DSH chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.chatHead{min-height:76px;flex:none;padding:10px 28px 0 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-start}
.chatTitleRow{height:30px;display:flex;align-items:center;gap:8px;min-width:0}
.chatTitle{font-size:14px;font-weight:500;line-height:20px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.chatBadges{display:flex;align-items:center;gap:5px;margin-left:4px}
.chatTabs{height:36px;display:flex;align-items:flex-end;gap:2px}
.chatTab{height:34px;padding:0 10px;color:var(--tertiary);font-size:13px;border-bottom:2px solid transparent}
.chatTab.active{color:var(--text);border-bottom-color:#f9fafb}
.chatBody{flex:1;min-height:0;overflow:auto;padding:16px 28px 4px}
.thread{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{font-size:14px;line-height:24px;color:var(--secondary)}
.msg .who{display:flex;align-items:center;gap:6px;margin-bottom:5px;color:var(--tertiary);font-size:11px}
.msg .who .avatar{width:20px;height:20px;font-size:8px}
.msg.user{align-self:flex-end;max-width:78%}
.msg.user .bubble{padding:9px 12px;background:var(--layer1);border:1px solid var(--border-soft);border-radius:12px;color:var(--text)}
.msg.assistant .bubble{padding:0}
.msg .bubble p{margin:0 0 8px}.msg .bubble p:last-child{margin:0}
.msg code{font-family:var(--mono);font-size:12px;background:var(--layer1);border:1px solid var(--border-soft);border-radius:4px;padding:1px 4px;color:#9fe4e8}
.tool{background:var(--sidebar);border:1px solid var(--border-soft);border-left:2px solid var(--blue);border-radius:8px;padding:8px 10px;margin:8px 0;font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--tertiary)}
.tool b{color:var(--secondary);font-weight:500}
.align{margin:8px 0 0;padding:8px 10px;border:1px solid var(--border-soft);border-left:2px solid var(--blue);background:var(--sidebar);border-radius:8px}
.align b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tertiary);font-weight:500;margin-bottom:4px}
.align ol{margin:0;padding-left:16px;color:var(--secondary);font-size:11.5px;line-height:1.65}
.align li{margin:2px 0}
.created{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0 7px}
.created-card{display:flex;flex-direction:column;gap:3px;min-width:0;padding:8px 9px;background:var(--layer1);border:1px solid var(--border-soft);border-radius:8px}
.created-card .cid{font-family:var(--mono);font-size:9px;color:var(--tertiary)}
.created-card .ckind{align-self:flex-start;font-size:8.5px;line-height:1.5;padding:0 5px;border-radius:4px;border:1px solid var(--border-soft);color:var(--tertiary)}
.created-card .ckind.inv{color:#d0bdff;border-color:rgba(183,166,255,.25);background:rgba(183,166,255,.07)}
.created-card .ckind.dev{color:#9fe4e8;border-color:rgba(57,197,207,.25);background:rgba(57,197,207,.07)}
.created-card b{font-size:11px;font-weight:500;line-height:1.4;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.created-card .cmeta{font-size:9px;color:var(--tertiary)}

.composerWrap{flex:none;padding:0 28px 10px;background:var(--bg)}
.composer{max-width:860px;margin:0 auto;background:var(--layer1);border:0.5px solid var(--border);border-radius:var(--radius-panel);padding:12px 14px;min-height:100px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.composer .ph{color:var(--caption);font-size:14px;line-height:24px;flex:1}
.composer .row{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--tertiary);font-size:11px}
.composer .row .grow{flex:1}
.composer .send{width:28px;height:28px;border-radius:50%;background:#f9fafb;color:#151517;display:grid;place-items:center;font-size:13px}
/* GodotBridge task center — classes mirror client/src/00-head.part TC_CSS */
.gbt-root{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--layer2);color:var(--text);font-size:13px;line-height:1.5}
.gbt-header{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:0.5px solid var(--border-strong);background:var(--layer3);flex-wrap:wrap}
.gbt-brand{display:flex;align-items:center;gap:10px;min-width:0}
.gbt-mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:600;font-size:15px;flex:none}
.gbt-title{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.gbt-titleline{display:flex;align-items:center;gap:7px;min-width:0}
.gbt-projectsource{flex:none;font-size:10px;line-height:1.6;padding:0 6px;border-radius:999px;text-transform:none;letter-spacing:0;background:var(--layer2);color:var(--secondary);border:0.5px solid var(--border-strong);cursor:default}
.gbt-projectsource[data-project-source="session"]{color:var(--blue);border-color:var(--blue)}
.gbt-project{margin:0;font-size:11px;color:var(--tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;font-family:var(--mono)}
.gbt-projectteam{margin:1px 0 0;font-size:10px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;color:var(--tertiary)}
.gbt-projectteam[data-project-team="ok"]{color:var(--secondary)}
.gbt-counts{display:flex;gap:6px;flex-wrap:wrap}
.gbt-count{display:flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--layer2);font-size:11px;color:var(--secondary)}
.gbt-count b{font-weight:600;color:var(--text)}
.gbt-controls{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.gbt-btn{appearance:none;border:0.5px solid var(--border-strong);background:var(--layer3);color:var(--text);height:30px;padding:0 12px;border-radius:8px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.gbt-btn:hover{background:rgba(255,255,255,.08)}
.gbt-btn[data-variant="primary"]{background:var(--blue);border-color:transparent;color:#fff}
.gbt-statusline{display:flex;align-items:center;gap:10px;padding:7px 18px;border-bottom:0.5px solid var(--border-strong);background:var(--layer2);font-size:11px;color:var(--tertiary);flex-wrap:wrap}
.gbt-dot{width:7px;height:7px;border-radius:50%;background:var(--tertiary);display:inline-block;flex:none}
.gbt-dot[data-running="true"]{background:var(--green);box-shadow:0 0 0 3px var(--layer2)}
.gbt-main{display:flex;min-height:0;flex:1}
.gbt-content{display:flex;flex-direction:column;min-width:0;flex:1;min-height:0}
.gbt-tabs{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap}
.gbt-tab{appearance:none;border:none;background:transparent;color:var(--secondary);font:inherit;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer}
.gbt-tab:hover{background:rgba(255,255,255,.06)}
.gbt-tab[data-active="true"]{background:var(--layer3);color:var(--text);font-weight:600}
.gbt-view{flex:1;min-height:0;overflow:auto;padding:12px 18px 18px}
.gbt-boardwrap{display:flex;flex-direction:column;height:100%;min-height:0}
.gbt-kindfilter{display:inline-flex;gap:6px;align-items:center;margin:0 0 10px;padding:3px;border-radius:999px;background:transparent}
.gbt-kindfilterbtn{font-size:12px;line-height:1.6;padding:2px 10px;border-radius:999px;border:none;background:transparent;color:var(--secondary);cursor:pointer}
.gbt-kindfilterbtn:hover{background:rgba(255,255,255,.06)}
.gbt-kindfilterbtn[data-active="true"]{background:var(--layer3);color:var(--text)}
.gbt-board{display:flex;gap:12px;align-items:stretch;flex:1 1 auto;min-height:0;overflow:auto}
.gbt-col{flex:1 1 0;min-width:172px;max-width:330px;background:var(--layer3);border:0.5px solid var(--border-strong);border-radius:12px;display:flex;flex-direction:column;max-height:100%;min-height:120px}
.gbt-colhead{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:0.5px solid var(--border-strong);font-size:11px;font-weight:600;color:var(--secondary);letter-spacing:.04em;text-transform:uppercase}
.gbt-colchev{font-size:10px;opacity:.75;width:9px}
.gbt-colcount{margin-left:auto;color:var(--tertiary);font-weight:500}
.gbt-colnote{margin-left:auto;font-size:9px;color:var(--amber);font-weight:400}
.gbt-cards{display:flex;flex-direction:column;gap:8px;padding:9px;overflow:auto;flex:1 1 auto;min-height:0}
.gbt-card{border:0.5px solid var(--border-strong);border-radius:10px;padding:10px 11px;background:var(--layer2);cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:border-color .12s}
.gbt-card:hover{border-color:var(--blue)}
.gbt-card[data-selected="true"]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.gbt-cardtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gbt-id{font-family:var(--mono);font-size:11px;color:var(--tertiary)}
.gbt-cardtitle{font-size:12px;font-weight:500;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.gbt-cardmeta{display:flex;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--tertiary)}
.gbt-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:5px;background:var(--layer2);color:var(--secondary);font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbt-chip[data-tone="ready"]{background:var(--layer3);color:var(--green)}
.gbt-chip[data-tone="waiting"]{background:var(--layer3);color:var(--amber)}
.gbt-chip[data-tone="running"]{background:var(--layer3);color:var(--green)}
.gbt-chip[data-tone="reviewing"]{background:var(--layer3);color:var(--amber)}
.gbt-chip[data-tone="testing"]{background:var(--layer3);color:var(--amber)}
.gbt-chip[data-tone="done"]{background:var(--layer3);color:var(--green)}
.gbt-chip[data-tone="blocked"]{background:var(--layer3);color:var(--red)}
.gbt-chip[data-tone="investigating"]{background:var(--layer3);color:var(--purple)}
.gbt-empty{padding:12px 9px;color:var(--tertiary);font-size:11px;text-align:center}
/* toolbar */
#toolbar{position:fixed;right:12px;bottom:12px;z-index:50;display:flex;gap:3px;align-items:center;background:rgba(21,21,23,.92);border:1px solid var(--border);border-radius:10px;padding:5px 7px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toolbar b{font-size:9px;color:var(--caption);margin-right:3px;letter-spacing:.1em}
#toolbar a{color:var(--tertiary);text-decoration:none;font-size:10px;padding:4px 6px;border-radius:5px}
#toolbar a:hover{background:var(--layer2);color:var(--text)}
body.chrome0 #toolbar{display:none}
</style>

frame 59: freed hitbox signal -> CRASH</pre><h3>证据</h3><table><thead><tr><th>命令</th><th>退出码</th><th>输出尾部</th></tr></thead><tbody><tr><td><code>godot --headless ...</code></td><td>1</td><td>Invalid access to object 'Hitbox' (freed)</td></tr><tr><td><code>node repro.mjs --frames 59</code></td><td>0</td><td>reproduced 1/1</td></tr><tr><td><code>node repro.mjs --frames 60</code></td><td>0</td><td>reproduced 0/1</td></tr></tbody></table><h3>结论</h3><ul><li>释放 hitbox 前先断开阶段信号。</li><li>用 <code>is_instance_valid()</code> 保护切换。</li><li>把第 59 帧加入 boss 回归场景。</li></ul><h3>产物</h3><div class="artifacts"><span class="artifact">.investigate/boss-repro/</span><span class="artifact">reports/T-102.log</span><span class="artifact">patches/hitbox-signal.patch</span></div></article></div>

<script>
const params = new URLSearchParams(location.search);
const screen = params.get('screen') || 'board';
if (params.get('chrome') === '0') document.body.classList.add('chrome0');
const tpl = document.getElementById('tpl-' + screen) || document.getElementById('tpl-board');
document.getElementById('main').appendChild(tpl.content.cloneNode(true));
const taskMode = screen !== 'dsh';
document.querySelectorAll('.panelRow').forEach(function (row) {
  if (row.getAttribute('data-panel') === 'task-center') row.classList.toggle('active', taskMode);
});
const taskProject = document.querySelector('[data-project="godot-bridge"]');
if (taskProject) taskProject.classList.toggle('active', taskMode);
document.querySelectorAll('.sessionRow').forEach(function (row) {
  if (taskMode) row.classList.remove('selected');
});
if (!taskMode) {
  const first = document.querySelector('.sessionRow');
  if (first) first.classList.add('selected');
}
if (params.get('simple') === '1') {
  document.querySelectorAll('.projectRow:not([data-project="godot-bridge"])').forEach(function (row) { row.remove(); });
  document.querySelectorAll('.sessionRow').forEach(function (row) { row.remove(); });
  document.querySelectorAll('.sectionHead').forEach(function (head) { if (head.textContent.indexOf('未分组') >= 0) head.remove(); });
  const count = document.querySelector('[data-project="godot-bridge"] .count');
  if (count) count.textContent = '1 个会话';
  const foot = document.querySelector('.sideFoot');
  if (foot) foot.innerHTML = '<div class="avatar">G</div><div><b>Godot 开发者</b><span>本地工作区</span></div>';
}
</script>
